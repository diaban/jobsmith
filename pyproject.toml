[project]
name = "agent-oo"
version = "0.1.0"
description = "Domain-agnostic agent planner/executor framework on LangGraph (OO node pattern)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.60",
]
openai = [
    "openai>=1.60",
]
# LangChain chat models for the conversational front agent (agent_oo/chat).
# langchain-core itself already comes in transitively via langgraph.
chat-anthropic = [
    "langchain-anthropic>=0.3",
]
chat-openai = [
    "langchain-openai>=0.3",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Persistence backends (checkpointer + store). Without either, state is
# in-memory only and nothing survives the process.
sqlite = [
    "langgraph-checkpoint-sqlite>=3.1",
]
postgres = [
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_oo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # create_react_agent moves to langchain.agents in langgraph v2; migrate then.
    "ignore:create_react_agent has been moved:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
