[project]
name = "jobsmith"
version = "0.1.0"
description = "A conversational agent that runs complex tasks as durable background jobs, and the domain-agnostic planner/executor framework underneath"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.3",   # create_agent + middleware for the chat layer
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.60",
]
openai = [
    "openai>=1.60",
]
# LangChain chat models for the conversational front agent (jobsmith/chat).
# langchain-core itself already comes in transitively via langgraph.
chat-anthropic = [
    "langchain-anthropic>=0.3",
]
chat-openai = [
    "langchain-openai>=0.3",
]
# Web search as a document source (Tavily). httpx also comes with .[api].
web = [
    "httpx>=0.27",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",      # the CLI talks to the daemon over HTTP
]
# Persistence backends (checkpointer + store). Without either, state is
# in-memory only and nothing survives the process.
sqlite = [
    "langgraph-checkpoint-sqlite>=3.1",
]
postgres = [
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyright>=1.1.400",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.scripts]
jobsmith = "jobsmith.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobsmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pyright]
# One configuration, two readers: the CLI (`make types`, hence `make check` and
# CI) and Pylance, which reads this same file — so the editor and the gate say
# the same thing. That agreement is the reason this project runs pyright rather
# than mypy: the bug that motivated #31 was found by Pylance and by nothing else.
include = ["jobsmith"]      # tests/ and evals/ are deliberately out of scope
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"      # the floor in requires-python, same as ruff's target-version
typeCheckingMode = "basic"

# On since #31 phase 2. The state schemas are `total=False` because a LangGraph
# node returns a *partial* update — right for writes, wrong for reads. The 31
# hits it found split three ways: 17 reads of `query`, guaranteed at entry and
# now `Required` in AgentState / CapabilityBaseState; 12 reads of a key
# guaranteed only by graph order (`aspects`, `generated_query`, `found`,
# `draft_answer`, ...), now read with a default that says what missing means;
# and 2 reads of `CapabilityResult`, whose keys really are all optional. It is
# therefore a read-discipline gate, and a blanket ignore on it defeats it.
reportTypedDictNotRequiredAccess = true

# The optional extras (anthropic, openai, langchain-anthropic/-openai, psycopg)
# are imported lazily behind `try: ... except ImportError`, and `make install`
# installs only `.[dev,api]`. Their absence is a fact about one environment, not
# a defect, so it must not turn the gate red for a developer who installed the
# documented minimum — while a *misspelled* import stays visible as a warning
# (and is loud at runtime anyway, which no type error otherwise is).
reportMissingImports = "warning"
