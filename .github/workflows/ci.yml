# What `make check` does locally, enforced on every push and pull request.
#
# The matrix is not decoration: pyproject declares requires-python >=3.11 and
# this project has already been bitten by version-specific behaviour in
# langgraph/langchain, so both supported versions are exercised.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:                      # a new push supersedes an in-flight run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # report both versions, not just the first failure
      matrix:
        python-version: ["3.11", "3.12"]

    # The Postgres paths (history at scale, delivery, LISTEN/NOTIFY events,
    # first setup) are skipped without `$JOBSMITH_TEST_PG`: a service here, in
    # this job, so they run on both versions and block the merge like the
    # rest, with no extra required check (→ 0169). 16, as measured in 0138.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobsmith
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # a PR's merge commit and both parents: the scope diffs them

      - name: Scope
        # A pull request that changes only `docs/**` and top-level Markdown
        # can break only the two docs tests: nothing else reads those files.
        # It runs them alone, still under this job's name, since skipping the
        # workflow would leave the required checks unreported (→ 0198). Any
        # other path, an empty or unreadable diff and every push run it all.
        # `--no-renames`: a file moved into docs/ is listed where it left too.
        id: scope
        run: |
          docs_only=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] \
             && changed=$(git diff --no-renames --name-only HEAD^1 HEAD); then
            docs_only=true
            while IFS= read -r path; do
              case "$path" in
                docs/*) ;;
                */*) docs_only=false ;;
                *.md) ;;
                *) docs_only=false ;;
              esac
            done <<< "$changed"
            printf '%s\n' "$changed"
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: ${{ steps.scope.outputs.docs_only != 'true' }}
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the project and every extra
        if: steps.scope.outputs.docs_only != 'true'
        # Same set as `make install-all`: providers and persistence backends
        # included, so their imports are type-checked and exercised by tests.
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install -p .venv/bin/python -e \
            ".[dev,api,tui,web,pdf,pptx,anthropic,openai,chat-anthropic,chat-openai,sqlite,postgres]"

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: .venv/bin/ruff check .

      - name: Type check
        if: steps.scope.outputs.docs_only != 'true'
        # Every extra is installed above, so this is the strictest reading of
        # the tree: the optional providers' imports resolve here, and the
        # `[tool.pyright]` config is the same one Pylance applies in the editor.
        run: .venv/bin/pyright

      - name: Domain-leakage gate
        if: steps.scope.outputs.docs_only != 'true'
        run: make leak-check

      - name: Tests
        if: steps.scope.outputs.docs_only != 'true'
        # No API key is available here: the deterministic fakes are what make
        # the suite runnable in CI at all. The database is new on every run,
        # so each run also exercises several workers' first setup at once.
        env:
          JOBSMITH_TEST_PG: postgresql://postgres:postgres@localhost:5432/jobsmith
        run: .venv/bin/python -m pytest tests/ -q -n auto

      - name: Docs tests
        # The fast path: pytest alone (pytest-asyncio only so pyproject's
        # `asyncio_mode` is a known option), without the conftest, which
        # imports the dependencies this path does not install.
        if: steps.scope.outputs.docs_only == 'true'
        run: |
          uv venv --python ${{ matrix.python-version }} .venv
          uv pip install -p .venv/bin/python pytest pytest-asyncio
          .venv/bin/python -m pytest -q --noconftest \
            tests/test_claude_md_budget.py tests/test_decision_records.py

  lockfile:
    # A stale lockfile is worse than none: it silently stops matching pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv.lock is up to date with pyproject.toml
        run: uv lock --check
